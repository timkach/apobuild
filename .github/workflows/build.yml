name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Принять лицензии Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Распаковать проект и скачать proot
        env:
          PROOT_URL: https://github.com/proot-me/proot/releases/download/v5.3.0/proot-v5.3.0-aarch64-static
        run: |
          test -f project.zip || { echo "project.zip не найден в корне репозитория"; exit 1; }
          unzip -q project.zip -d src
          mkdir -p src/app/src/main/jniLibs/arm64-v8a
          curl -fL "$PROOT_URL" -o src/app/src/main/jniLibs/arm64-v8a/libproot.so
          chmod +x src/app/src/main/jniLibs/arm64-v8a/libproot.so

      - name: Собрать Debug APK
        working-directory: src
        run: gradle assembleDebug --no-daemon

      - name: Загрузить готовый APK
        uses: actions/upload-artifact@v4
        with:
          name: AgentBox-apk
          path: src/app/build/outputs/apk/debug/*.apk
