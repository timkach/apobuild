name: Build APK
on:
  push:
    paths: ['project.zip']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unpack and fetch proot
        env:
          PROOT_URL: https://github.com/proot-me/proot/releases/download/v5.3.0/proot-v5.3.0-aarch64-static
        run: |
          unzip -q project.zip -d src
          mkdir -p src/app/src/main/jniLibs/arm64-v8a
          curl -fL "$PROOT_URL" -o src/app/src/main/jniLibs/arm64-v8a/libproot.so
          chmod +x src/app/src/main/jniLibs/arm64-v8a/libproot.so
      - name: Build
        working-directory: src
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AgentBox-apk
          path: src/app/build/outputs/apk/debug/*.apk
